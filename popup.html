<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      width: 180px; 
      padding: 15px; 
      text-align: center; 
      background-color: #282828;
      color: #ffffff;
      margin: 0;
      border-radius: 8px;
    }
    h3 { 
      margin-top: 0; 
      font-size: 15px;
      margin-bottom: 12px;
    }
    select { 
      padding: 8px; 
      font-size: 14px; 
      width: 100%; 
      cursor: pointer;
      background-color: #383838;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      outline: none;
    }
    select:hover {
      border-color: #888;
    }
    .status-text {
      font-size: 11px;
      color: #aaaaaa;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h3>YouTube Ad Speed</h3>
  <select id="speedSelect">
    <option value="5">5x Speed</option>
    <option value="10">10x Speed</option>
    <option value="16" selected>16x Speed (Max)</option>
  </select>
  <div class="status-text">Teleporting active</div>
  
  <script src="popup.js"></script> 
</body>
</html>
